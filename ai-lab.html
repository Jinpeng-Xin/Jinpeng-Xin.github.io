    <script src="pptxgen.bundle.js"></script>
    <script>
        // 支持 ?endpoint=http://127.0.0.1:8787 临时指向本地测试后端,不传就用线上地址
        const CHAT_ENDPOINT = new URLSearchParams(location.search).get('endpoint')
            || 'https://hq-dataset-qa-rbcocnorur.cn-hangzhou.fcapp.run';

        async function callBackend(payload) {
            const res = await fetch(CHAT_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        /* ---------- 登录(邮箱验证码,免密码) + 对话历史(存服务端OSS,不是访客本地存储) ---------- */
        let AUTH_TOKEN = localStorage.getItem('hqds-auth-token') || null;
        let AUTH_EMAIL = localStorage.getItem('hqds-auth-email') || null;
        let historyConversations = []; // 当前登录用户的对话列表缓存,登录/保存/删除后原地同步,减少多余请求
        const currentConvId = { chat: null, ask: null, quiz: null, ppt: null }; // 当前这一屏对应服务端哪条记录;新对话时清空,下次保存就会新建一条

        const authBackdrop = document.getElementById('auth-backdrop');
        const authLoginView = document.getElementById('auth-login-view');
        const authAccountView = document.getElementById('auth-account-view');
        const authGithubLoginBtn = document.getElementById('auth-github-login-btn');
        const authStatusEl = document.getElementById('auth-status');
        const authAccountAvatar = document.getElementById('auth-account-avatar');
        const authAccountEmail = document.getElementById('auth-account-email');

        function setAuthStatus(text, type) {
            if (!text) { authStatusEl.style.display = 'none'; return; }
            authStatusEl.style.display = 'block';
            authStatusEl.className = 'ppt-status ' + (type === 'err' ? 'ppt-status-err' : 'ppt-status-info');
            authStatusEl.textContent = text;
        }

        function refreshSidebarUserBtn() {
            const avatarEl = document.getElementById('sidebar-user-avatar');
            const nameEl = document.getElementById('sidebar-user-name');
            const subEl = document.getElementById('sidebar-user-sub');
            if (AUTH_EMAIL) {
                avatarEl.textContent = AUTH_EMAIL[0].toUpperCase();
                nameEl.textContent = AUTH_EMAIL;
                subEl.textContent = '点击查看账号';
            } else {
                avatarEl.textContent = '访';
                nameEl.textContent = '访客模式';
                subEl.textContent = '点击登录,保存对话历史';
            }
        }

        function openAuthDialog() {
            authBackdrop.style.display = 'flex';
            setAuthStatus('');
            if (AUTH_EMAIL) {
                authLoginView.style.display = 'none';
                authAccountView.style.display = 'block';
                authAccountAvatar.textContent = AUTH_EMAIL[0].toUpperCase();
                authAccountEmail.textContent = AUTH_EMAIL;
            } else {
                authLoginView.style.display = 'block';
                authAccountView.style.display = 'none';
            }
        }
        function closeAuthDialog() { authBackdrop.style.display = 'none'; }
        // 未登录时想用核心功能:不是静默失败,而是弹登录框——调用方 return 前先调这个
        function requireLogin() {
            if (AUTH_EMAIL) return true;
            openAuthDialog();
            return false;
        }

        document.getElementById('sidebar-user-btn').addEventListener('click', openAuthDialog);
        document.getElementById('auth-close-btn').addEventListener('click', closeAuthDialog);
        document.getElementById('auth-cancel-btn').addEventListener('click', closeAuthDialog);
        document.getElementById('auth-account-close-btn').addEventListener('click', closeAuthDialog);
        authBackdrop.addEventListener('click', (e) => { if (e.target === authBackdrop) closeAuthDialog(); });

        /* ---------- GitHub OAuth:跳转授权 -> GitHub回调带code回来 -> 换成本站自己的会话token ---------- */
        // TODO: 建好GitHub OAuth App后把这个换成真实的Client ID(公开值,不是secret,写在前端没问题)
        const GITHUB_CLIENT_ID = 'Ov23ctDOq0cWiP0dwetk';
        const GITHUB_REDIRECT_URI = location.origin + location.pathname; // 必须跟OAuth App里登记的callback URL完全一致

        authGithubLoginBtn.addEventListener('click', () => {
            if (GITHUB_CLIENT_ID === 'YOUR_GITHUB_CLIENT_ID') {
                setAuthStatus('还没配置 GitHub OAuth App 的 Client ID,登录暂时用不了。', 'err');
                return;
            }
            const state = crypto.randomUUID();
            sessionStorage.setItem('hqds-oauth-state', state);
            const url = new URL('https://github.com/login/oauth/authorize');
            url.searchParams.set('client_id', GITHUB_CLIENT_ID);
            url.searchParams.set('redirect_uri', GITHUB_REDIRECT_URI);
            url.searchParams.set('scope', 'read:user user:email');
            url.searchParams.set('state', state);
            location.href = url.toString();
        });

        /* 页面一加载就检查:是不是刚从GitHub授权页跳回来的(带着 ?code=&state=) */
        async function handleGithubOAuthCallback() {
            const params = new URLSearchParams(location.search);
            const code = params.get('code');
            const state = params.get('state');
            if (!code) return;

            const expectedState = sessionStorage.getItem('hqds-oauth-state');
            sessionStorage.removeItem('hqds-oauth-state');
            // 不管成功失败,先把 code/state 从地址栏清掉,免得刷新页面重复用掉这个一次性code
            history.replaceState(null, '', location.pathname);

            if (!state || state !== expectedState) {
                openAuthDialog();
                setAuthStatus('登录校验失败(state不匹配),请重新登录。', 'err');
                return;
            }
            openAuthDialog();
            setAuthStatus('登录中…', 'info');
            try {
                const data = await callBackend({ mode: 'auth_github_exchange', code });
                if (data.error) throw new Error(data.error);
                AUTH_TOKEN = data.token;
                AUTH_EMAIL = data.name;
                localStorage.setItem('hqds-auth-token', AUTH_TOKEN);
                localStorage.setItem('hqds-auth-email', AUTH_EMAIL);
                refreshSidebarUserBtn();
                closeAuthDialog();
                refreshHistoryList();
            } catch (e) {
                setAuthStatus('登录失败：' + e.message, 'err');
            }
        }

        document.getElementById('auth-logout-btn').addEventListener('click', () => {
            AUTH_TOKEN = null;
            AUTH_EMAIL = null;
            localStorage.removeItem('hqds-auth-token');
            localStorage.removeItem('hqds-auth-email');
            historyConversations = [];
            currentConvId.chat = currentConvId.ask = currentConvId.quiz = currentConvId.ppt = null;
            refreshSidebarUserBtn();
            renderHistoryList();
            closeAuthDialog();
        });

        /* ---------- 历史对话:侧边栏分组,登录后拉列表,点击某条=把那一屏内容恢复回来 ---------- */
        const historyGroupBtn = document.getElementById('history-group-btn');
        const historyBody = document.getElementById('history-body');
        const historyListEl = document.getElementById('history-list');
        const historyEmptyEl = document.getElementById('history-empty');

        // 历史对话现在是常驻显示的一个区块,不再靠点击展开——数据本来就已经在登录后/页面加载时自动拉取了(见下方 refreshHistoryList 调用处)

        function formatRelTime(ts) {
            const diff = Date.now() / 1000 - ts;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            if (diff < 86400 * 7) return Math.floor(diff / 86400) + '天前';
            return new Date(ts * 1000).toLocaleDateString();
        }
        const HISTORY_MODE_LABEL = { chat: '问答', ask: '资料问答', quiz: '自测', ppt: 'PPT' };

        function renderHistoryList() {
            if (!AUTH_EMAIL) {
                historyEmptyEl.textContent = '登录后可以查看过往的对话记录';
                historyEmptyEl.style.display = 'block';
                historyListEl.innerHTML = '';
                return;
            }
            if (!historyConversations.length) {
                historyEmptyEl.textContent = '还没有历史对话';
                historyEmptyEl.style.display = 'block';
                historyListEl.innerHTML = '';
                return;
            }
            historyEmptyEl.style.display = 'none';
            historyListEl.innerHTML = historyConversations.map(c => `
                <div class="sidebar-history-item" data-id="${c.id}">
                    <span class="sidebar-history-item-meta">
                        <span class="sidebar-history-item-title">[${HISTORY_MODE_LABEL[c.mode] || c.mode}] ${escapeHtml(c.title || '未命名对话')}</span>
                        <span class="sidebar-history-item-time">${formatRelTime(c.updated_at)}</span>
                    </span>
                    <button class="sidebar-history-item-del" data-id="${c.id}" title="删除" aria-label="删除">✕</button>
                </div>
            `).join('');
            historyListEl.querySelectorAll('.sidebar-history-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.sidebar-history-item-del')) return;
                    loadConversation(el.dataset.id);
                });
            });
            historyListEl.querySelectorAll('.sidebar-history-item-del').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    try {
                        const data = await callBackend({ mode: 'delete_conversation', token: AUTH_TOKEN, id });
                        historyConversations = data.conversations || [];
                        renderHistoryList();
                    } catch (err) { /* 删除失败就留着,不打扰用户 */ }
                });
            });
        }

        async function refreshHistoryList() {
            if (!AUTH_EMAIL) { renderHistoryList(); return; }
            try {
                const data = await callBackend({ mode: 'list_conversations', token: AUTH_TOKEN });
                if (data.error) throw new Error(data.error);
                historyConversations = data.conversations || [];
            } catch (e) { /* 拉取失败就先显示空列表,不阻塞其它功能 */ }
            renderHistoryList();
        }

        async function loadConversation(id) {
            try {
                const data = await callBackend({ mode: 'get_conversation', token: AUTH_TOKEN, id });
                if (data.error) throw new Error(data.error);
                const rec = data.conversation;
                if (rec.mode === 'chat') {
                    switchMode('chat');
                    chatScroll.innerHTML = rec.scrollHTML;
                    chatMessages = rec.messages || [];
                    currentConvId.chat = rec.id;
                } else if (rec.mode === 'ask') {
                    switchMode('ask');
                    askScroll.innerHTML = rec.scrollHTML;
                    currentConvId.ask = rec.id;
                } else if (rec.mode === 'quiz') {
                    switchMode('quiz');
                    quizScroll.innerHTML = rec.scrollHTML;
                    quizPending = null;
                    quizInputbar.style.display = 'none';
                    showQuizAction('再来一题');
                    currentConvId.quiz = rec.id;
                } else {
                    switchMode('ppt');
                    pptScroll.innerHTML = rec.scrollHTML;
                    pptData = rec.pptData || null;
                    currentConvId.ppt = rec.id;
                    if (pptData) {
                        renderPptCanvas(pptData);
                        pptInputbar.style.display = 'block';
                        openPptCanvas();
                    }
                }
            } catch (e) {
                alert('加载失败：' + e.message);
            }
        }

        /* 只有登录时才保存,访客模式行为跟之前完全一样;标题从当前这屏内容里摘一句,不用用户自己起名 */
        function deriveConvTitle(mode) {
            if (mode === 'ppt') return (pptData && pptData.title) || 'PPT草稿';
            const scrollEl = mode === 'chat' ? chatScroll : mode === 'ask' ? askScroll : quizScroll;
            const firstUserMsg = scrollEl.querySelector('.msg-row.user .msg-bubble');
            if (firstUserMsg) {
                const text = firstUserMsg.textContent.trim();
                return text.length > 24 ? text.slice(0, 24) + '…' : text;
            }
            return mode === 'chat' ? '新对话' : mode === 'ask' ? '问答对话' : '自测练习';
        }

        async function saveConversation(mode) {
            if (!AUTH_EMAIL) return; // 访客模式:不保存,跟之前的行为完全一样
            const scrollEl = mode === 'chat' ? chatScroll : mode === 'ask' ? askScroll : mode === 'quiz' ? quizScroll : pptScroll;
            const conversation = {
                id: currentConvId[mode],
                mode,
                title: deriveConvTitle(mode),
                scrollHTML: scrollEl.innerHTML,
                pptData: mode === 'ppt' ? pptData : undefined,
                messages: mode === 'chat' ? chatMessages : undefined,
            };
            try {
                const data = await callBackend({ mode: 'save_conversation', token: AUTH_TOKEN, conversation });
                if (data.error) throw new Error(data.error);
                currentConvId[mode] = data.id;
                historyConversations = data.conversations || [];
                renderHistoryList();
            } catch (e) { /* 静默失败:保存历史不该打断正在进行的对话体验 */ }
        }

        refreshSidebarUserBtn();
        if (AUTH_EMAIL) refreshHistoryList();
        handleGithubOAuthCallback();

        /* ---------- 侧边栏收缩/展开(记忆状态) ---------- */
        const appSidebar = document.getElementById('app-sidebar');
        const sidebarCollapseBtn = document.getElementById('sidebar-collapse-btn');
        if (localStorage.getItem('hqds-sidebar-collapsed') === '1') {
            appSidebar.classList.add('collapsed');
        }
        sidebarCollapseBtn.addEventListener('click', () => {
            const collapsed = appSidebar.classList.toggle('collapsed');
            localStorage.setItem('hqds-sidebar-collapsed', collapsed ? '1' : '0');
        });

        /* ---------- 轻量 Markdown 渲染 ---------- */
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function inlineFormat(s) {
            return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        }
        function renderMarkdown(text) {
            const lines = escapeHtml(text).split('\n');
            let html = '';
            let inList = false;
            for (const raw of lines) {
                const line = raw.trim();
                const bullet = line.match(/^[-*]\s+(.*)/);
                if (bullet) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += `<li>${inlineFormat(bullet[1])}</li>`;
                } else {
                    if (inList) { html += '</ul>'; inList = false; }
                    if (line) html += `<p>${inlineFormat(line)}</p>`;
                }
            }
            if (inList) html += '</ul>';
            return html || '&nbsp;';
        }

        /* ---------- 模式切换 ---------- */
        const qaGroupBtn = document.getElementById('qa-group-btn');
        const qaModeSwitch = document.getElementById('qa-mode-switch');

        function switchMode(mode) {
            const inQaGroup = mode === 'ask' || mode === 'quiz';
            // 只有在问答/自测之间切换时才重算胶囊内的active——切去PPT时不动它,
            // 这样"高质量数据集问答"胶囊会记住你切走之前停在问答还是自测
            if (inQaGroup) {
                qaModeSwitch.querySelectorAll('.mode-switch-btn[data-mode]').forEach(b => {
                    b.classList.toggle('active', b.dataset.mode === mode);
                });
            }
            document.querySelectorAll('.chat-thread').forEach(t => {
                t.classList.toggle('active', t.dataset.mode === mode);
            });
            qaGroupBtn.classList.toggle('active', inQaGroup);
            qaModeSwitch.style.display = inQaGroup ? 'inline-flex' : 'none';
            document.getElementById('new-chat-btn').classList.toggle('active', mode === 'chat');
            if (mode === 'chat') {
                setTimeout(() => document.getElementById('chat-input').focus(), 50);
            } else if (mode === 'ask') {
                setTimeout(() => document.getElementById('ask-input').focus(), 50);
            }
        }
        document.querySelectorAll('.mode-switch-btn[data-mode]').forEach(btn => {
            btn.addEventListener('click', () => switchMode(btn.dataset.mode));
        });
        qaGroupBtn.addEventListener('click', () => {
            // 记住胶囊里当前选中的是问答还是自测,回来时停在原来那个子模式上
            const remembered = document.querySelector('#qa-mode-switch .mode-switch-btn.active')?.dataset.mode || 'ask';
            switchMode(remembered);
        });
        // "生成PPT"是和"高质量数据集问答"平级的独立入口,点了直接弹主题对话框(openPptDialog 定义见下文)
        document.getElementById('ppt-open-btn').addEventListener('click', () => openPptDialog());

        function autoGrow(el) {
            el.addEventListener('input', () => {
                el.style.height = 'auto';
                el.style.height = Math.min(el.scrollHeight, 140) + 'px';
            });
        }

        /* ---------- 通用:插入一条消息 ---------- */
        function appendMessage(scrollEl, role, opts) {
            const emptyState = scrollEl.querySelector('.chat-empty');
            if (emptyState) emptyState.remove();

            const row = document.createElement('div');
            row.className = `msg-row ${role}`;

            const bubbleClass = ['msg-bubble', opts.bubbleClass].filter(Boolean).join(' ');
            const label = opts.label ? `<span class="quiz-label">${opts.label}</span>` : '';
            const copyBtn = role === 'bot'
                ? `<button class="msg-copy-btn" type="button" title="复制"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>`
                : '';

            row.innerHTML = `
                <div class="msg-body">
                    <div class="${bubbleClass}">${label}${opts.html}</div>
                    ${copyBtn}
                </div>
            `;
            scrollEl.appendChild(row);
            scrollEl.scrollTop = scrollEl.scrollHeight;
            return row;
        }

        function appendSources(scrollEl, sources) {
            if (!sources || !sources.length) return;
            const wrap = document.createElement('div');
            wrap.className = 'msg-sources';
            wrap.innerHTML = sources.map(s => `<span class="msg-source-chip">${escapeHtml(s.source)} · 第${s.page}页</span>`).join('');
            scrollEl.appendChild(wrap);
            scrollEl.scrollTop = scrollEl.scrollHeight;
        }

        function appendTyping(scrollEl) {
            return appendMessage(scrollEl, 'bot', {
                html: `<span class="typing-dots"><span></span><span></span><span></span></span>`
            });
        }

        /* 复制按钮:事件委托,任何 .msg-copy-btn 点了就复制同一个 .msg-body 里的正文 */
        const COPY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`;
        const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.msg-copy-btn');
            if (!btn) return;
            const bubble = btn.closest('.msg-body')?.querySelector('.msg-bubble');
            const text = bubble?.innerText.trim();
            if (!text) return; // 还在打字动画时(内容是空的三个点)点了不做任何事
            navigator.clipboard.writeText(text).then(() => {
                btn.classList.add('copied');
                btn.innerHTML = CHECK_ICON;
                setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = COPY_ICON; }, 1200);
            }).catch(() => {});
        });

        /* ---------- 通用问答("新对话"进的就是这里):不检索、不限定语料,DeepSeek直接回答,支持多轮上下文 ---------- */
        const chatScroll = document.getElementById('chat-scroll');
        const chatScrollPristineHTML = chatScroll.innerHTML;
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        autoGrow(chatInput);

        let chatMessages = []; // 多轮上下文,跟着请求一起发,后端不存这个状态

        async function sendChat() {
            const q = chatInput.value.trim();
            if (!q) return;
            if (!requireLogin()) return; // 不登录不让用,输入框里的字保留着,登录完再发一次就行
            chatInput.value = '';
            chatInput.style.height = 'auto';
            chatSend.disabled = true;

            appendMessage(chatScroll, 'user', { html: escapeHtml(q) });
            chatMessages.push({ role: 'user', content: q });
            const loadingRow = appendTyping(chatScroll);

            try {
                const data = await callBackend({ mode: 'chat', token: AUTH_TOKEN, messages: chatMessages });
                if (data.error) throw new Error(data.error);
                loadingRow.querySelector('.msg-bubble').innerHTML = renderMarkdown(data.answer);
                chatMessages.push({ role: 'assistant', content: data.answer });
                await saveConversation('chat');
            } catch (e) {
                loadingRow.querySelector('.msg-bubble').textContent = '出错了：' + e.message;
                chatMessages.pop(); // 请求失败就把刚才那句用户消息退回去,不留半截上下文
            } finally {
                chatSend.disabled = false;
                chatInput.focus();
            }
        }
        chatSend.addEventListener('click', sendChat);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
        });

        /* ---------- 问答模式(限定在本页"高质量数据集"资料范围内,跟上面的通用问答是两码事) ---------- */
        const askScroll = document.getElementById('ask-scroll');
        const askScrollPristineHTML = askScroll.innerHTML;
        const askInput = document.getElementById('ask-input');
        const askSend = document.getElementById('ask-send');
        autoGrow(askInput);

        async function sendAsk() {
            const q = askInput.value.trim();
            if (!q) return;
            if (!requireLogin()) return;
            askInput.value = '';
            askInput.style.height = 'auto';
            askSend.disabled = true;

            appendMessage(askScroll, 'user', { html: escapeHtml(q) });
            const loadingRow = appendTyping(askScroll);

            try {
                const data = await callBackend({ mode: 'ask', token: AUTH_TOKEN, question: q });
                if (data.error) throw new Error(data.error);
                loadingRow.querySelector('.msg-bubble').innerHTML = renderMarkdown(data.answer);
                appendSources(askScroll, data.sources);
                await saveConversation('ask');
            } catch (e) {
                loadingRow.querySelector('.msg-bubble').textContent = '出错了：' + e.message;
            } finally {
                askSend.disabled = false;
                askInput.focus();
            }
        }
        askSend.addEventListener('click', sendAsk);
        askInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAsk(); }
        });

        /* 空状态里的示例问题芯片:点了直接填进对应输入框并发送 */
        document.querySelectorAll('#chat-empty .suggestion-chip').forEach((btn) => {
            btn.addEventListener('click', () => {
                chatInput.value = btn.textContent.trim();
                sendChat();
            });
        });
        document.querySelectorAll('#ask-empty .suggestion-chip').forEach((btn) => {
            btn.addEventListener('click', () => {
                askInput.value = btn.textContent.trim();
                sendAsk();
            });
        });

        /* ---------- 自测模式 ---------- */
        const quizScroll = document.getElementById('quiz-scroll');
        const quizScrollPristineHTML = quizScroll.innerHTML;
        const quizInput = document.getElementById('quiz-input');
        const quizSend = document.getElementById('quiz-send');
        const quizInputbar = document.getElementById('quiz-inputbar');
        const quizActionBar = document.getElementById('quiz-action-bar');
        const quizStartBar = document.getElementById('quiz-start-bar');
        const quizStartEmpty = document.getElementById('quiz-start-empty');
        autoGrow(quizInput);

        let quizPending = null; // { question, context }

        function showQuizInput() {
            quizInputbar.style.display = 'block';
            quizActionBar.style.display = 'none';
            setTimeout(() => quizInput.focus(), 50);
        }
        function showQuizAction(label) {
            quizInputbar.style.display = 'none';
            quizActionBar.style.display = 'flex';
            quizStartBar.textContent = label;
        }

        async function startQuiz(triggerBtn) {
            if (!requireLogin()) return;
            triggerBtn.disabled = true;
            const original = triggerBtn.textContent;
            triggerBtn.textContent = '出题中…';

            const loadingRow = appendTyping(quizScroll);
            try {
                const data = await callBackend({ mode: 'quiz_start', token: AUTH_TOKEN });
                if (data.error) throw new Error(data.error);
                quizPending = { question: data.question, context: data.context };
                loadingRow.querySelector('.msg-bubble').classList.add('quiz-question');
                loadingRow.querySelector('.msg-bubble').innerHTML =
                    `<span class="quiz-label">题目</span><br>${renderMarkdown(data.question)}`;
                showQuizInput();
                await saveConversation('quiz');
            } catch (e) {
                loadingRow.querySelector('.msg-bubble').textContent = '出题失败：' + e.message;
                showQuizAction('重试');
            } finally {
                triggerBtn.disabled = false;
                triggerBtn.textContent = original === '出题中…' ? '出一道题' : original;
            }
        }

        quizStartEmpty.addEventListener('click', () => startQuiz(quizStartEmpty));
        quizStartBar.addEventListener('click', () => startQuiz(quizStartBar));

        async function submitQuizAnswer() {
            const answer = quizInput.value.trim();
            if (!answer || !quizPending) return;
            if (!requireLogin()) return;
            quizInput.value = '';
            quizInput.style.height = 'auto';
            quizSend.disabled = true;

            appendMessage(quizScroll, 'user', { html: escapeHtml(answer) });
            const loadingRow = appendTyping(quizScroll);

            try {
                const data = await callBackend({
                    mode: 'quiz_grade',
                    token: AUTH_TOKEN,
                    question: quizPending.question,
                    context: quizPending.context,
                    answer: answer
                });
                if (data.error) throw new Error(data.error);
                loadingRow.querySelector('.msg-bubble').classList.add('quiz-feedback');
                loadingRow.querySelector('.msg-bubble').innerHTML =
                    `<span class="quiz-label">点评</span><br>${renderMarkdown(data.feedback)}`;
                await saveConversation('quiz');
            } catch (e) {
                loadingRow.querySelector('.msg-bubble').textContent = '批改失败：' + e.message;
            } finally {
                quizPending = null;
                quizSend.disabled = false;
                showQuizAction('再来一题');
            }
        }
        quizSend.addEventListener('click', submitQuizAnswer);
        quizInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuizAnswer(); }
        });

        /* ---------- 新对话:不是"清空当前模式",而是单独开一个全新的通用问答("新对话"跟"高质量数据集问答"是两码事) ---------- */
        document.getElementById('new-chat-btn').addEventListener('click', async () => {
            // 如果当前正好在通用问答里且已经聊了内容,先存一下再开新的,不然刚聊完一半就被顶掉了
            // 这里必须await:不等它存完就清currentConvId的话,存那一半的回调回来时会把id写回去,产生一条脏记录
            if (AUTH_EMAIL && document.querySelector('.chat-thread.active').dataset.mode === 'chat') {
                await saveConversation('chat');
            }
            currentConvId.chat = null;
            chatScroll.innerHTML = chatScrollPristineHTML;
            chatMessages = [];
            chatInput.value = '';
            chatInput.style.height = 'auto';
            switchMode('chat');
        });

        /* ---------- 生成PPT:弹窗只确定主题,提交后当成一轮对话插进PPT线程里 ---------- */
        const PPT_ACCENT = '3A3A3E';
        const PPT_ACCENT_DARK = '1F1F22';

        const pptBackdrop = document.getElementById('ppt-backdrop');
        const pptStatusEl = document.getElementById('ppt-status');
        const pptTopicInput = document.getElementById('ppt-topic-input');
        const pptSlidesSelect = document.getElementById('ppt-slides-select');
        const pptGenerateBtn = document.getElementById('ppt-generate-btn');

        const pptScroll = document.getElementById('ppt-scroll');
        const pptScrollPristineHTML = pptScroll.innerHTML;
        const pptInputbar = document.getElementById('ppt-inputbar');
        const pptEditInput = document.getElementById('ppt-edit-input');
        const pptEditSend = document.getElementById('ppt-edit-send');
        autoGrow(pptEditInput);

        let pptData = null;   // 当前这份大纲,ppt_edit 靠它带上下文;每轮对话各自的下载按钮用闭包存自己那份快照
        let pptBusy = false;

        function setPptStatus(text, type) {
            if (!text) { pptStatusEl.style.display = 'none'; return; }
            pptStatusEl.style.display = 'block';
            pptStatusEl.className = 'ppt-status ' + (type === 'err' ? 'ppt-status-err' : 'ppt-status-info');
            pptStatusEl.innerHTML = text;
        }

        /* ---------- 右侧画布:所见即所得,始终显示pptData这"当前一版" ---------- */
        const pptCanvas = document.getElementById('ppt-canvas');
        const pptCanvasTitle = document.getElementById('ppt-canvas-title');
        const pptCanvasBody = document.getElementById('ppt-canvas-body');
        const pptCanvasDownloadBtn = document.getElementById('ppt-canvas-download');

        function openPptCanvas() { pptCanvas.classList.add('open'); }
        function closePptCanvas() { pptCanvas.classList.remove('open'); }
        document.getElementById('ppt-canvas-close').addEventListener('click', closePptCanvas);
        pptCanvasDownloadBtn.addEventListener('click', () => {
            if (pptData) downloadPptx(pptData, pptCanvasDownloadBtn);
        });

        /* ---------- Logo:整个过程都在浏览器本地完成,图片从不上传到任何地方 ----------
           file → FileReader读成base64 data URL → 一直存在这个JS变量里 →
           预览时当成一个普通<img>摆在画布上,下载时pptxgenjs的addImage()直接吃这个data URL。 */
        const PPT_CANVAS_W_IN = 10, PPT_CANVAS_H_IN = 5.625;
        let pptLogoDataUrl = null;
        let pptLogoAspect = 1; // 宽/高,用来让logo不被拉伸变形
        let pptLogoCorner = 'bottom-right'; // top-left|top-right|bottom-left|bottom-right|center
        let pptLogoScale = 1; // 相对基准宽度(0.7in)的倍数

        /* 单页插图:跟Logo共用一个按钮和文件选择框,靠"有没有聚焦某一内容页"区分用途——
           没聚焦/聚焦封面 = 传的是Logo(套所有页);聚焦某一内容页 = 传的是插到那一页里的图。
           同样是纯本地处理,base64存着,预览摆<img>,导出时pptxgenjs.addImage()吃同一个data URL。 */
        const pptSlideImages = {}; // { [num]: { dataUrl, aspect } },num=内容页页码(1..N,不含封面)
        const PPT_SLIDE_IMG_W = 3.4; // 插图固定宽度(in),高度按原图比例算,不会被拉伸

        function pptLogoCornerLabel(corner) {
            return { 'top-left': '左上角', 'top-right': '右上角', 'bottom-left': '左下角', 'bottom-right': '右下角', 'center': '居中' }[corner] || corner;
        }

        function pptLogoBoxIn() {
            if (!pptLogoDataUrl) return null;
            const margin = 0.3;
            const w = 0.7 * pptLogoScale;
            const h = w / pptLogoAspect;
            const positions = {
                'top-left': { x: margin, y: margin },
                'top-right': { x: PPT_CANVAS_W_IN - margin - w, y: margin },
                'bottom-left': { x: margin, y: PPT_CANVAS_H_IN - margin - h },
                'bottom-right': { x: PPT_CANVAS_W_IN - margin - w, y: PPT_CANVAS_H_IN - margin - h },
                'center': { x: (PPT_CANVAS_W_IN - w) / 2, y: (PPT_CANVAS_H_IN - h) / 2 },
            };
            const pos = positions[pptLogoCorner] || positions['bottom-right'];
            return { x: pos.x, y: pos.y, w, h };
        }

        /* logo的位置/大小走对话,但完全在本地解析,不用打后端——这本来就是纯前端渲染的事,
           跟DeepSeek生成的大纲内容没关系,没必要为了"挪个角"多打一次API。 */
        function parsePptLogoCommand(text) {
            if (!/logo|标志|图标/i.test(text)) return null;
            const cmd = {};
            if (/左上/.test(text)) cmd.corner = 'top-left';
            else if (/右上/.test(text)) cmd.corner = 'top-right';
            else if (/左下/.test(text)) cmd.corner = 'bottom-left';
            else if (/右下/.test(text)) cmd.corner = 'bottom-right';
            else if (/居中|中间|中央/.test(text)) cmd.corner = 'center';
            if (/大一?点|大一?些|放大|变大/.test(text)) cmd.scaleFactor = 1.25;
            else if (/小一?点|小一?些|缩小|变小/.test(text)) cmd.scaleFactor = 0.8;
            return cmd;
        }
        function pptLogoHTML() {
            const box = pptLogoBoxIn();
            if (!box) return '';
            const style = `left:${box.x / PPT_CANVAS_W_IN * 100}%;top:${box.y / PPT_CANVAS_H_IN * 100}%;`
                + `width:${box.w / PPT_CANVAS_W_IN * 100}%;height:${box.h / PPT_CANVAS_H_IN * 100}%;`;
            return `<img class="ws-el ws-logo" src="${pptLogoDataUrl}" style="${style}">`;
        }

        /* 插图的位置算法跟Logo同一套思路:固定宽度+按原图比例算高度,摆在body占位符(x0.55 y1.35 w8.9 h3.9)的右侧,
           左边留给收窄后的要点文字(见下面 .wysiwyg-slide.has-image .ws-bullets),垂直居中对齐。 */
        function pptSlideImageBoxIn(num) {
            const img = pptSlideImages[num];
            if (!img) return null;
            const bodyBox = { x: 0.55, y: 1.35, w: 8.9, h: 3.9 };
            const w = PPT_SLIDE_IMG_W;
            const h = Math.min(w / img.aspect, bodyBox.h);
            return { x: bodyBox.x + bodyBox.w - w, y: bodyBox.y + (bodyBox.h - h) / 2, w, h };
        }
        function pptSlideImageHTML(num) {
            const box = pptSlideImageBoxIn(num);
            if (!box) return '';
            const style = `left:${box.x / PPT_CANVAS_W_IN * 100}%;top:${box.y / PPT_CANVAS_H_IN * 100}%;`
                + `width:${box.w / PPT_CANVAS_W_IN * 100}%;height:${box.h / PPT_CANVAS_H_IN * 100}%;`;
            return `<img class="ws-el ws-slide-image" src="${pptSlideImages[num].dataUrl}" style="${style}">`;
        }

        const pptLogoBtn = document.getElementById('ppt-logo-btn');
        const pptLogoInput = document.getElementById('ppt-logo-input');

        /* 按钮的文字/状态跟着"有没有聚焦某一内容页"切换,点之前就知道现在传的是Logo还是插图 */
        function updatePptUploadBtn() {
            const targetNum = (pptFocusNum !== null && pptFocusNum !== 0) ? pptFocusNum : null;
            if (targetNum !== null) {
                const has = !!pptSlideImages[targetNum];
                pptLogoBtn.textContent = has ? '插图 ✓' : '插图';
                pptLogoBtn.classList.toggle('set', has);
                pptLogoBtn.title = has
                    ? `第${targetNum}页已插图(点击更换,本地处理,不上传)`
                    : `给第${targetNum}页插入一张图(本地处理,不上传)`;
            } else {
                pptLogoBtn.textContent = pptLogoDataUrl ? 'Logo ✓' : 'Logo';
                pptLogoBtn.classList.toggle('set', !!pptLogoDataUrl);
                pptLogoBtn.title = pptLogoDataUrl
                    ? '已设置Logo(点击更换,本地处理,不上传)'
                    : '每页加个Logo(只在本地处理,不会上传)';
            }
        }

        pptLogoBtn.addEventListener('click', () => pptLogoInput.click());
        pptLogoInput.addEventListener('change', () => {
            const file = pptLogoInput.files && pptLogoInput.files[0];
            if (!file) return;
            // 点按钮那一刻是什么状态,就决定这张图传给谁——跟按钮当时显示的文字是同一个判断
            const targetNum = (pptFocusNum !== null && pptFocusNum !== 0) ? pptFocusNum : null;
            const reader = new FileReader();
            reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                    const aspect = img.naturalWidth / img.naturalHeight || 1;
                    if (targetNum === null) {
                        pptLogoAspect = aspect;
                        pptLogoDataUrl = reader.result;
                    } else {
                        pptSlideImages[targetNum] = { dataUrl: reader.result, aspect };
                    }
                    updatePptUploadBtn();
                    if (pptAllSlides.length) renderPptPage(); // 已经有预览的话,立刻补上
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
            pptLogoInput.value = ''; // 允许连续选同一个文件也能再次触发change
        });

        /* 按 downloadPptx() 实际导出坐标换算的WYSIWYG单页标记,和真实pptx一一对应,不是随便排的卡片 */
        function renderSlideHTML(slide) {
            const num = slide.cover ? 0 : slide.num;
            const focusedCls = pptFocusNum === num ? ' focused' : '';
            if (slide.cover) {
                return `
                    <div class="wysiwyg-slide cover${focusedCls}" data-num="0">
                        <div class="ws-el ws-cover-title">${escapeHtml(slide.title)}</div>
                        <div class="ws-el ws-cover-sub">高质量数据集 · 自动生成</div>
                        <div class="ws-slide-index">封面</div>
                        ${pptLogoHTML()}
                    </div>`;
            }
            const hasImageCls = pptSlideImages[slide.num] ? ' has-image' : '';
            return `
                <div class="wysiwyg-slide${focusedCls}${hasImageCls}" data-num="${slide.num}">
                    <div class="ws-el ws-title">${escapeHtml(slide.title)}</div>
                    <div class="ws-el ws-bar"></div>
                    <div class="ws-el ws-bullets"><ul>${slide.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join('')}</ul></div>
                    ${pptSlideImageHTML(slide.num)}
                    ${pptLogoHTML()}
                    <div class="ws-slide-index">${slide.num}</div>
                </div>`;
        }

        /* ---------- 点某一页=只改这一页:选中态 + 编辑框上方的提示条 ---------- */
        let pptFocusNum = null; // null=没聚焦(整份大纲级别); 0=封面; 1..N=对应内容页
        const pptFocusChip = document.getElementById('ppt-focus-chip');
        const pptFocusChipLabel = document.getElementById('ppt-focus-chip-label');

        function pptFocusLabel(num) { return num === 0 ? '封面' : `第 ${num} 页`; }

        function setPptFocus(num) {
            pptFocusNum = num;
            pptCanvasBody.querySelectorAll('.wysiwyg-slide[data-num]').forEach(el => {
                el.classList.toggle('focused', Number(el.dataset.num) === num);
            });
            if (num === null) {
                pptFocusChip.style.display = 'none';
                pptEditInput.placeholder = '说说怎么改,比如「第3页精简成3条要点」…';
            } else {
                pptFocusChip.style.display = 'flex';
                pptFocusChipLabel.textContent = pptFocusLabel(num);
                pptEditInput.placeholder = `只针对${pptFocusLabel(num)}说说怎么改…`;
            }
            updatePptUploadBtn();
        }

        pptCanvasBody.addEventListener('click', (e) => {
            const slideEl = e.target.closest('.wysiwyg-slide[data-num]');
            if (!slideEl) return;
            const num = Number(slideEl.dataset.num);
            setPptFocus(pptFocusNum === num ? null : num); // 再点一次同一页 = 退出单页修改
        });
        document.getElementById('ppt-focus-chip-clear').addEventListener('click', () => setPptFocus(null));

        /* 画布一次只显示PPT_PAGE_SIZE页,靠翻页看其余的——而不是把所有页堆成一个长列表压扁比例 */
        const PPT_PAGE_SIZE = 3;
        let pptAllSlides = [];  // 封面 + 内容页展平成一个数组,每项自带展示用的 num/cover 标记
        let pptPageStart = 0;

        function renderPptPage() {
            const total = pptAllSlides.length;
            const start = Math.min(pptPageStart, Math.max(0, total - 1));
            const end = Math.min(start + PPT_PAGE_SIZE, total);
            const pageItems = pptAllSlides.slice(start, end);
            pptCanvasBody.innerHTML = `
                <div class="ppt-pager">
                    <button class="ppt-pager-btn" id="ppt-page-prev" ${start === 0 ? 'disabled' : ''} aria-label="上一组">‹</button>
                    <span class="ppt-pager-label">第 ${start + 1}–${end} 页 / 共 ${total} 页</span>
                    <button class="ppt-pager-btn" id="ppt-page-next" ${end >= total ? 'disabled' : ''} aria-label="下一组">›</button>
                </div>
                ${pageItems.map(renderSlideHTML).join('')}
            `;
            document.getElementById('ppt-page-prev').addEventListener('click', () => {
                pptPageStart = Math.max(0, pptPageStart - PPT_PAGE_SIZE);
                renderPptPage();
            });
            document.getElementById('ppt-page-next').addEventListener('click', () => {
                pptPageStart = Math.min(total - 1, pptPageStart + PPT_PAGE_SIZE);
                renderPptPage();
            });
        }

        function renderPptCanvas(data) {
            pptCanvasTitle.textContent = data.title;
            pptAllSlides = [
                { cover: true, title: data.title },
                ...data.slides.map((s, i) => ({ ...s, num: i + 1 })),
            ];
            pptPageStart = 0;
            renderPptPage();
        }

        /* 线程里只留一句简短的确认+一个"查看预览"入口,完整内容看右侧画布,不再把整份大纲堆在气泡里 */
        function appendPptConfirm(text) {
            const row = appendMessage(pptScroll, 'bot', {
                html: `${escapeHtml(text)} <a href="javascript:void(0)" class="ppt-canvas-link">查看预览 →</a>`,
            });
            row.querySelector('.ppt-canvas-link').addEventListener('click', openPptCanvas);
            return row;
        }

        function openPptDialog() {
            pptBackdrop.style.display = 'flex';
            setPptStatus('');
            pptTopicInput.focus();
        }
        function closePptDialog() { pptBackdrop.style.display = 'none'; }

        document.getElementById('ppt-start-empty').addEventListener('click', openPptDialog);
        document.getElementById('ppt-close-btn').addEventListener('click', closePptDialog);
        document.getElementById('ppt-cancel-btn').addEventListener('click', closePptDialog);
        pptBackdrop.addEventListener('click', (e) => { if (e.target === pptBackdrop) closePptDialog(); });

        async function generatePptOutline() {
            const topic = pptTopicInput.value.trim();
            if (!topic || pptBusy) return;
            if (!requireLogin()) { closePptDialog(); return; }
            pptBusy = true;
            pptGenerateBtn.disabled = true;
            setPptStatus('<span class="ppt-spin"></span>正在生成大纲…', 'info');
            try {
                const data = await callBackend({
                    mode: 'ppt_outline',
                    token: AUTH_TOKEN,
                    topic,
                    slides: Number(pptSlidesSelect.value),
                    grounded: document.getElementById('ppt-grounded-checkbox').checked,
                });
                if (data.error) throw new Error(data.error);
                pptData = data;

                closePptDialog();
                switchMode('ppt');
                appendMessage(pptScroll, 'user', { html: escapeHtml(topic) });
                appendPptConfirm(`已经生成《${pptData.title}》的大纲,共 ${pptData.slides.length} 页。`);
                renderPptCanvas(pptData);
                openPptCanvas();
                pptInputbar.style.display = 'block';
                pptTopicInput.value = '';
                setTimeout(() => pptEditInput.focus(), 50);
                await saveConversation('ppt');
            } catch (e) {
                setPptStatus('生成失败：' + e.message, 'err');
            } finally {
                pptBusy = false;
                pptGenerateBtn.disabled = false;
            }
        }
        pptGenerateBtn.addEventListener('click', generatePptOutline);
        pptTopicInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); generatePptOutline(); }
        });

        /* 生成之后的继续对话:就是线程里普通的发消息,只是回复内容是更新后的整份大纲。
           聚焦了某一页时,给指令加一句范围限定前缀——不用改后端,ppt_edit本来就是"照指令改,其余不动"的prompt,
           前缀只是把"其余不动"的范围明确到具体某一页。 */
        async function sendPptEdit() {
            const instruction = pptEditInput.value.trim();
            if (!instruction || !pptData || pptBusy) return;

            // logo的位置/大小是纯本地状态,不属于DeepSeek管的大纲内容——命中了就地处理,不打后端
            const logoCmd = parsePptLogoCommand(instruction);
            if (logoCmd) {
                pptEditInput.value = '';
                pptEditInput.style.height = 'auto';
                appendMessage(pptScroll, 'user', { html: escapeHtml(instruction) });
                if (!pptLogoDataUrl) {
                    appendPptConfirm('还没设置Logo——先点右侧画布顶部的"Logo"按钮选一张本地图片。');
                } else if (!logoCmd.corner && !logoCmd.scaleFactor) {
                    appendPptConfirm('没太看懂具体怎么调整——支持"logo挪到左上角/右上角/左下角/右下角/居中"、"logo大一点/小一点"这类说法,换个说法再试试。');
                } else {
                    if (logoCmd.corner) pptLogoCorner = logoCmd.corner;
                    if (logoCmd.scaleFactor) pptLogoScale = Math.max(0.4, Math.min(2.5, pptLogoScale * logoCmd.scaleFactor));
                    renderPptPage();
                    const parts = [];
                    if (logoCmd.corner) parts.push(`挪到${pptLogoCornerLabel(pptLogoCorner)}`);
                    if (logoCmd.scaleFactor) parts.push(logoCmd.scaleFactor > 1 ? '调大了一些' : '调小了一些');
                    appendPptConfirm(`已经把logo${parts.join('、')}。`);
                }
                return;
            }

            if (!requireLogin()) return;

            const focusNum = pptFocusNum;
            const scopedInstruction = focusNum === null
                ? instruction
                : `(只修改${pptFocusLabel(focusNum)},其余页原样保留,不要动) ${instruction}`;

            pptEditInput.value = '';
            pptEditInput.style.height = 'auto';
            pptBusy = true;
            pptEditSend.disabled = true;

            const tag = focusNum === null ? '' : `<span class="ppt-canvas-link" style="pointer-events:none;">【${pptFocusLabel(focusNum)}】</span> `;
            appendMessage(pptScroll, 'user', { html: tag + escapeHtml(instruction) });
            const loadingRow = appendTyping(pptScroll);

            try {
                const data = await callBackend({ mode: 'ppt_edit', token: AUTH_TOKEN, current: pptData, instruction: scopedInstruction });
                if (data.error) throw new Error(data.error);
                pptData = data;
                loadingRow.remove();
                appendPptConfirm('已经按你的意思更新了大纲。');
                renderPptCanvas(pptData);
                openPptCanvas();
                await saveConversation('ppt');
            } catch (e) {
                loadingRow.querySelector('.msg-bubble').textContent = '修改失败：' + e.message;
            } finally {
                pptBusy = false;
                pptEditSend.disabled = false;
            }
        }
        pptEditSend.addEventListener('click', sendPptEdit);
        pptEditInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPptEdit(); }
        });

        /* 下载:接收明确传入的大纲快照 + 触发它的按钮,而不是读全局状态,
           这样历史上每一轮回复的下载按钮,点了都还是拿到"当时那版"内容 */
        async function downloadPptx(data, triggerBtn) {
            const original = triggerBtn.textContent;
            triggerBtn.disabled = true;
            triggerBtn.textContent = '正在拼装…';
            try {
                const pptx = new PptxGenJS();
                pptx.defineLayout({ name: 'HQDS', width: PPT_CANVAS_W_IN, height: PPT_CANVAS_H_IN });
                pptx.layout = 'HQDS';
                const logoBox = pptLogoBoxIn(); // null 或 {x,y,w,h},跟预览用的是同一个算法,不会对不上

                /* 真正的PPT母版:用defineSlideMaster生成OOXML层面的slideMaster/slideLayout,
                   而不是每页重复画一遍形状。在PowerPoint里"视图→幻灯片母版"能看到这两版母版,
                   改母版上的配色/logo位置/字体,所有用它的页面会跟着变——这才是"母版"的本意。 */
                const coverObjects = [
                    { placeholder: {
                        options: { name: 'title', type: 'title', x: 0.7, y: 2.2, w: 8.6, h: 1.4, fontSize: 30, bold: true, color: 'FFFFFF', fontFace: 'Microsoft YaHei' },
                        text: '标题',
                    } },
                    { text: {
                        text: '高质量数据集 · 自动生成',
                        options: { x: 0.7, y: 3.5, w: 8.6, h: 0.5, fontSize: 13, color: 'C7C7CC', fontFace: 'Microsoft YaHei' },
                    } },
                ];
                if (logoBox) coverObjects.push({ image: { data: pptLogoDataUrl, ...logoBox } });
                pptx.defineSlideMaster({
                    title: 'MASTER_COVER',
                    background: { color: PPT_ACCENT },
                    objects: coverObjects,
                });

                const contentObjects = [
                    { placeholder: {
                        options: { name: 'title', type: 'title', x: 0.55, y: 0.4, w: 8.9, h: 0.7, fontSize: 22, bold: true, color: PPT_ACCENT_DARK, fontFace: 'Microsoft YaHei' },
                        text: '标题',
                    } },
                    { rect: { x: 0.55, y: 1.05, w: 0.5, h: 0.045, fill: { color: PPT_ACCENT } } },
                    { placeholder: {
                        options: { name: 'body', type: 'body', x: 0.55, y: 1.35, w: 8.9, h: 3.9, fontSize: 15, color: '333333', fontFace: 'Microsoft YaHei', valign: 'top' },
                        text: '正文',
                    } },
                ];
                if (logoBox) contentObjects.push({ image: { data: pptLogoDataUrl, ...logoBox } });
                pptx.defineSlideMaster({
                    title: 'MASTER_CONTENT',
                    background: { color: 'FFFFFF' },
                    objects: contentObjects,
                    slideNumber: { x: 9.55, y: 5.3, fontSize: 10, color: '999999' },
                });

                const cover = pptx.addSlide({ masterName: 'MASTER_COVER' });
                cover.addText(data.title, { placeholder: 'title' });

                for (const s of data.slides) {
                    const slide = pptx.addSlide({ masterName: 'MASTER_CONTENT' });
                    slide.addText(s.title, { placeholder: 'title' });
                    const bulletRuns = s.bullets.map(b => ({ text: b, options: { bullet: { code: '25AA' }, breakLine: true, paraSpaceAfter: 10 } }));
                    const slideImg = pptSlideImages[s.num];
                    if (slideImg) {
                        // 这一页有插图:不用母版的body占位符(那是全宽的),改成显式坐标,文字收窄给插图让出右边位置
                        slide.addText(bulletRuns, { x: 0.55, y: 1.35, w: 4.5, h: 3.9, fontSize: 15, color: '333333', fontFace: 'Microsoft YaHei', valign: 'top' });
                        slide.addImage({ data: slideImg.dataUrl, ...pptSlideImageBoxIn(s.num) });
                    } else {
                        slide.addText(bulletRuns, { placeholder: 'body' });
                    }
                }

                const fileName = (data.title || 'presentation').replace(/[\\/:*?"<>|]/g, '') + '.pptx';
                await pptx.writeFile({ fileName });
            } catch (e) {
                alert('导出失败：' + e.message);
            } finally {
                triggerBtn.disabled = false;
                triggerBtn.textContent = original;
            }
        }

    </script>
</body>
</html>
