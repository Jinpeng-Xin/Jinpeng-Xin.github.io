<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海 8km 数字孪生 · 32 Agent 实时群聊</title>
<style>
  :root {
    --bg-app: #d8dce2;
    --wx-nav: #2e2e2e;
    --wx-list: #e6e5e5;
    --wx-list-active: #c8c6c5;
    --wx-list-hover: #dad9d9;
    --wx-chat-bg: #f5f5f5;
    --wx-border: #dcdcdc;
    --wx-green: #95ec69;
    --wx-white: #ffffff;
    --wx-text: #191919;
    --wx-dim: #7f7f7f;
    --wx-faint: #a6a6a6;
    --f-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei UI', sans-serif;
    --f-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg-app); color: var(--wx-text);
    font-family: var(--f-ui); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  .wx-shell {
    width: min(1140px, 98vw); height: min(780px, 95vh);
    background: var(--wx-chat-bg); border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.08);
    display: flex; overflow: hidden;
  }
  /* 1. 最左侧微信深色图标栏 */
  .wx-rail {
    width: 60px; flex-shrink: 0; background: var(--wx-nav);
    display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 18px;
  }
  .rail-me {
    width: 36px; height: 36px; border-radius: 6px;
    background: linear-gradient(135deg, #0284c7, #38bdf8);
    color: #fff; font: 700 13px var(--f-ui); display: flex; align-items: center; justify-content: center;
  }
  .rail-btn {
    width: 38px; height: 38px; border-radius: 7px; border: none; background: transparent;
    color: #9e9e9e; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .rail-btn:hover { color: #e5e5e5; background: rgba(255,255,255,0.08); }
  .rail-btn.active { color: #07c160; }
  .rail-spacer { flex: 1; }

  /* 2. 中间群聊/成员列表栏 */
  .wx-sidebar {
    width: 262px; flex-shrink: 0; background: var(--wx-list);
    border-right: 1px solid var(--wx-border); display: flex; flex-direction: column;
  }
  .sb-search {
    padding: 14px 12px 10px; background: #f7f7f7; border-bottom: 1px solid var(--wx-border);
  }
  .sb-search input {
    width: 100%; height: 28px; border: none; border-radius: 5px;
    background: #e2e2e2; padding: 0 10px; font: 400 12px var(--f-ui); color: var(--wx-text); outline: none;
  }
  .sb-search input:focus { background: #fff; box-shadow: 0 0 0 1px #07c160; }
  .sb-list { flex: 1; overflow-y: auto; }
  .ch-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 12px; cursor: pointer;
    transition: background 0.12s;
  }
  .ch-item:hover { background: var(--wx-list-hover); }
  .ch-item.active { background: var(--wx-list-active); }
  .ch-ava {
    width: 40px; height: 40px; border-radius: 5px; flex-shrink: 0;
    color: #fff; font: 700 13px var(--f-ui); display: flex; align-items: center; justify-content: center;
  }
  .ch-info { flex: 1; min-width: 0; }
  .ch-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .ch-name { font: 600 13px/1.3 var(--f-ui); color: var(--wx-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-time { font: 400 10.5px var(--f-mono); color: var(--wx-faint); flex-shrink: 0; }
  .ch-sub { font: 400 11.5px/1.35 var(--f-ui); color: var(--wx-dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 3. 右侧主聊天窗口 */
  .wx-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--wx-chat-bg); }
  .chat-hd {
    height: 56px; flex-shrink: 0; padding: 0 20px;
    border-bottom: 1px solid var(--wx-border); background: var(--wx-chat-bg);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .chat-title { font: 600 15.5px var(--f-ui); color: var(--wx-text); display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #07c160; display: inline-block; box-shadow: 0 0 6px #07c160; }
  .live-dot.off { background: #a6a6a6; box-shadow: none; }
  .hd-actions { display: flex; align-items: center; gap: 8px; }
  .hd-pill {
    font: 500 11.5px var(--f-ui); color: var(--wx-dim); background: #eaeaea;
    border: 1px solid #d8d8d8; border-radius: 5px; padding: 4px 10px; cursor: pointer;
  }
  .hd-pill:hover { background: #e0e0e0; color: var(--wx-text); }
  .hd-pill.on { background: #e6f7ed; border-color: #07c160; color: #067a3c; }

  /* 角色筛选条 */
  .filter-bar {
    padding: 7px 20px; background: #efefef; border-bottom: 1px solid var(--wx-border);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px;
  }
  .f-chip {
    padding: 3px 10px; border-radius: 999px; border: 1px solid #d4d4d4;
    background: #fff; color: #555; cursor: pointer; font: 500 11px var(--f-ui);
  }
  .f-chip.active { background: #07c160; border-color: #07c160; color: #fff; }
  .f-stat { margin-left: auto; font: 400 11px var(--f-mono); color: var(--wx-dim); }

  /* 聊天消息流 */
  .chat-body {
    flex: 1; overflow-y: auto; padding: 18px 22px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .sys-note {
    align-self: center; font: 400 11px var(--f-ui); color: #8c8c8c;
    background: rgba(0,0,0,0.05); padding: 3px 11px; border-radius: 4px;
  }
  .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 78%; }
  .msg-row.right { align-self: flex-end; flex-direction: row-reverse; }
  .msg-ava {
    width: 36px; height: 36px; border-radius: 5px; flex-shrink: 0;
    color: #fff; font: 700 12.5px var(--f-ui); display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .msg-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .msg-row.right .msg-col { align-items: flex-end; }
  .msg-meta {
    display: flex; align-items: center; gap: 6px; font: 400 11px var(--f-ui); color: var(--wx-dim); flex-wrap: wrap;
  }
  .role-tag {
    font: 600 9.5px var(--f-ui); padding: 1px 5px; border-radius: 3px; color: #fff;
  }
  .msg-bubble {
    position: relative; padding: 9px 13px; border-radius: 6px;
    background: var(--wx-white); color: var(--wx-text);
    font: 400 13.5px/1.6 var(--f-ui); word-break: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .msg-row.right .msg-bubble { background: var(--wx-green); }
  .msg-to { font: 500 12px var(--f-ui); color: #0284c7; margin-right: 4px; }
  .msg-loc { font: 400 10.5px var(--f-mono); color: #8c8c8c; margin-top: 3px; }

  /* 底部信息栏 / 数据源配置条 */
  .chat-foot {
    padding: 10px 18px; border-top: 1px solid var(--wx-border); background: #f0f0f0;
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--wx-dim);
  }
  .cfg-modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: center; justify-content: center; z-index: 50;
  }
  .cfg-modal.on { display: flex; }
  .cfg-card {
    width: min(500px, 92vw); background: #fff; border-radius: 10px; padding: 18px 20px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 12px;
  }
  .cfg-card h3 { font: 600 15px var(--f-ui); color: #111; }
  .cfg-card p { font: 400 12px/1.6 var(--f-ui); color: #555; }
  .cfg-card input {
    width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font: 400 12px var(--f-mono); outline: none;
  }
  .cfg-card input:focus { border-color: #07c160; }
  .cfg-btns { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 780px) {
    .wx-shell { width: 100vw; height: 100vh; border-radius: 0; }
    .wx-rail { display: none; }
    .wx-sidebar { width: 190px; }
    .msg-row { max-width: 90%; }
  }
</style>
</head>
<body>

<div class="wx-shell">
  <!-- 微信左侧窄导航 -->
  <div class="wx-rail">
    <div class="rail-me" title="X-PHS 8km 观察者">辛</div>
    <button class="rail-btn active" id="tab-chats" title="群聊列表">💬</button>
    <button class="rail-btn" id="tab-roster" title="32 人花名册">👥</button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="btn-open-cfg" title="配置 Google Sheets 实时数据源">⚙</button>
    <a class="rail-btn" href="index.html" title="返回个人主页" style="text-decoration:none;">🏠</a>
  </div>

  <!-- 左侧群聊 / 通讯录列表 -->
  <div class="wx-sidebar">
    <div class="sb-search">
      <input type="text" id="search-in" placeholder="搜索成员、地点或对话内容…">
    </div>
    <div class="sb-list" id="sb-list"></div>
  </div>

  <!-- 右侧主聊天窗口 -->
  <div class="wx-main">
    <div class="chat-hd">
      <div class="chat-title">
        <span class="live-dot" id="live-dot"></span>
        <span id="room-title">上海 8km 建设总群 (32)</span>
      </div>
      <div class="hd-actions">
        <button class="hd-pill on" id="btn-live-poll">实时刷新: 4s</button>
        <button class="hd-pill" id="btn-refresh-now">立即拉取</button>
        <button class="hd-pill" id="btn-cfg-top">数据源配置</button>
      </div>
    </div>
    <div class="filter-bar">
      <button class="f-chip active" data-role="all">全部角色</button>
      <button class="f-chip" data-role="城市领导">城市领导</button>
      <button class="f-chip" data-role="片区经理">片区经理</button>
      <button class="f-chip" data-role="施工工程师">施工工程师</button>
      <button class="f-chip" data-role="质检监理">质检监理</button>
      <span class="f-stat" id="sync-stat">正在连接数据源…</span>
    </div>
    <div class="chat-body" id="chat-body"></div>
    <div class="chat-foot">
      <span id="foot-info">当前为只读观察者模式 · 对话由上海 8km 数字孪生空间 32 名自由意志 Agent 实时产生</span>
    </div>
  </div>
</div>

<!-- 数据源配置弹窗 -->
<div class="cfg-modal" id="cfg-modal">
  <div class="cfg-card">
    <h3>配置 Google Sheets 实时对话数据源</h3>
    <p>将你在 Google Apps Script 部署得到的 Web App URL（<code>https://script.google.com/macros/s/.../exec</code>）粘贴到下方，网页将每 4 秒实时拉取最新 Agent 对话。留空则读取仓库内的 <code>data/agent-dialogues.json</code>。</p>
    <input type="text" id="cfg-url-in" placeholder="https://script.google.com/macros/s/xxxxx/exec">
    <div class="cfg-btns">
      <button class="hd-pill" id="cfg-cancel">取消</button>
      <button class="hd-pill on" id="cfg-save">保存并立即拉取</button>
    </div>
  </div>
</div>

<script>
(function () {
  // 如果你已部署好 Google Apps Script Web App，可直接把 URL 填在这里，访客打开即自动实时同步
  const DEFAULT_SHEET_API = '';
  const FALLBACK_JSON_URL = './data/agent-dialogues.json';
  const STORAGE_KEY_API = 'xphs_wx_sheet_api_v1';

  const ROLE_COLOR = {
    '城市领导':   '#b45309',
    '片区经理':   '#0369a1',
    '施工工程师': '#c2410c',
    '质检监理':   '#047857',
    '注册市民':   '#4338ca'
  };

  const ROOMS = [
    { id: 'all',     name: '上海 8km 建设总群 (32)', color: '#07c160', tag: '总群', roles: null },
    { id: 'exec',    name: '陆家嘴领导班子群 (8)',   color: '#b45309', tag: '管理', roles: ['城市领导', '片区经理'] },
    { id: 'site',    name: '一线工地与质检群 (24)',  color: '#c2410c', tag: '工地', roles: ['施工工程师', '质检监理'] },
    { id: 'citizen', name: '市民生活与投诉频道',     color: '#0284c7', tag: '市民', roles: ['注册市民', '城市领导'] }
  ];

  const ROSTER = [
    ['周明远(LD-01)','城市领导','男·51岁 · 爱搞面子工程、催工期'],
    ['林素华(LD-02)','城市领导','女·47岁 · 老练圆滑、明哲保身'],
    ['陈静(PM-01)','片区经理','女·36岁 · 细腻务实、夹心层压力大'],
    ['王建军(PM-02)','片区经理','男·41岁 · 向上谄媚、向下压榨加班'],
    ['赵磊(PM-03)','片区经理','男·38岁 · 本位主义、爱抢预算'],
    ['许婷(PM-04)','片区经理','女·34岁 · 野心勃勃、擅长抢功'],
    ['刘强(ENG-01)','施工工程师','男·44岁 · 工地老油条、爱摸鱼'],
    ['张伟(ENG-02)','施工工程师','男·39岁 · 脾气爆、反感外行瞎指挥'],
    ['李娜(ENG-03)','施工工程师','女·29岁 · 年轻想表现、常背脏活'],
    ['赵敏(QA-01)','质检监理','女·38岁 · 硬骨头质检、油盐不进'],
    ['钱国华(QA-02)','质检监理','男·49岁 · 人情放水型、睁一眼闭一眼'],
    ['孙丽(QA-03)','质检监理','女·36岁 · 拿鸡毛当令箭、爱卡审批']
  ];

  let activeTab = 'chats';
  let activeRoom = 'all';
  let activeRoleFilter = 'all';
  let searchQuery = '';
  let livePolling = true;
  let allMessages = [];
  let lastCount = -1;

  const urlParams = new URLSearchParams(location.search);
  let apiUrl = urlParams.get('api') || localStorage.getItem(STORAGE_KEY_API) || DEFAULT_SHEET_API;

  const elSbList    = document.getElementById('sb-list');
  const elChatBody  = document.getElementById('chat-body');
  const elRoomTitle = document.getElementById('room-title');
  const elSyncStat  = document.getElementById('sync-stat');
  const elLiveDot   = document.getElementById('live-dot');
  const elSearch    = document.getElementById('search-in');
  const elModal     = document.getElementById('cfg-modal');
  const elCfgIn     = document.getElementById('cfg-url-in');

  function renderSidebar() {
    if (activeTab === 'chats') {
      elSbList.innerHTML = ROOMS.map(r => {
        const roomMsgs = allMessages.filter(m => !r.roles || r.roles.includes(m.role));
        const last = roomMsgs[roomMsgs.length - 1];
        const preview = last ? `${last.speaker.split('(')[0]}: ${last.text}` : '暂无消息';
        const tm = last ? last.time : '';
        return `<div class="ch-item ${activeRoom === r.id ? 'active' : ''}" data-room="${r.id}">
          <div class="ch-ava" style="background:${r.color}">${r.tag}</div>
          <div class="ch-info">
            <div class="ch-top"><span class="ch-name">${r.name}</span><span class="ch-time">${tm}</span></div>
            <div class="ch-sub">${preview}</div>
          </div>
        </div>`;
      }).join('');
      elSbList.querySelectorAll('[data-room]').forEach(el => {
        el.addEventListener('click', () => {
          activeRoom = el.getAttribute('data-room');
          const r = ROOMS.find(x => x.id === activeRoom);
          elRoomTitle.textContent = r ? r.name : '上海 8km 建设总群';
          renderSidebar();
          renderMessages(true);
        });
      });
    } else {
      elSbList.innerHTML = ROSTER.map(([name, role, desc]) => {
        const col = ROLE_COLOR[role] || '#475569';
        const shortN = name.slice(0, 1);
        return `<div class="ch-item" data-speaker="${name.split('(')[0]}">
          <div class="ch-ava" style="background:${col}">${shortN}</div>
          <div class="ch-info">
            <div class="ch-top"><span class="ch-name">${name}</span><span class="ch-time">${role}</span></div>
            <div class="ch-sub">${desc}</div>
          </div>
        </div>`;
      }).join('');
      elSbList.querySelectorAll('[data-speaker]').forEach(el => {
        el.addEventListener('click', () => {
          elSearch.value = el.getAttribute('data-speaker');
          searchQuery = elSearch.value.trim().toLowerCase();
          renderMessages(true);
        });
      });
    }
  }

  function renderMessages(forceScroll = false) {
    const room = ROOMS.find(r => r.id === activeRoom);
    const filtered = allMessages.filter(m => {
      if (room && room.roles && !room.roles.includes(m.role)) return false;
      if (activeRoleFilter !== 'all' && m.role !== activeRoleFilter) return false;
      if (searchQuery) {
        const blob = `${m.speaker} ${m.role} ${m.target || ''} ${m.location || ''} ${m.text}`.toLowerCase();
        if (!blob.includes(searchQuery)) return false;
      }
      return true;
    });

    const nearBottom = (elChatBody.scrollHeight - elChatBody.scrollTop - elChatBody.clientHeight) < 90;
    if (!filtered.length) {
      elChatBody.innerHTML = '<div class="sys-note">当前频道暂无符合条件的 Agent 对话记录</div>';
      return;
    }

    let lastTimeTag = '';
    const html = [];
    for (const m of filtered) {
      if (m.time && m.time.slice(0, 5) !== lastTimeTag) {
        lastTimeTag = m.time.slice(0, 5);
        html.push(`<div class="sys-note">${m.time}</div>`);
      }
      const isRight = (m.role === '城市领导' || m.role === '注册市民');
      const col = ROLE_COLOR[m.role] || '#475569';
      const avaTxt = (m.speaker || 'A').slice(0, 1);
      const toHtml = m.target ? `<span class="msg-to">@${m.target.split('(')[0]}</span>` : '';
      const locHtml = m.location ? `<div class="msg-loc">📍 ${m.location}</div>` : '';
      html.push(
        `<div class="msg-row ${isRight ? 'right' : ''}">` +
          `<div class="msg-ava" style="background:${col}" title="${m.speaker}">${avaTxt}</div>` +
          `<div class="msg-col">` +
            `<div class="msg-meta"><span class="role-tag" style="background:${col}">${m.role || 'Agent'}</span><span>${m.speaker}</span></div>` +
            `<div class="msg-bubble">${toHtml}${m.text}${locHtml}</div>` +
          `</div>` +
        `</div>`
      );
    }
    elChatBody.innerHTML = html.join('');
    if (forceScroll || nearBottom) elChatBody.scrollTop = elChatBody.scrollHeight;
  }

  async function fetchMessages(forceScroll = false) {
    const targetUrl = apiUrl ? apiUrl : `${FALLBACK_JSON_URL}?t=${Date.now()}`;
    try {
      const res = await fetch(targetUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.entries || data.data || []);
      allMessages = list;
      const changed = list.length !== lastCount;
      lastCount = list.length;
      const now = new Date();
      const tStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      elSyncStat.textContent = `${apiUrl ? 'Google Sheets 实时同步' : '仓库 JSON 快照'} · ${list.length} 条 · ${tStr}`;
      elLiveDot.classList.toggle('off', !livePolling);
      if (changed || forceScroll) {
        renderSidebar();
        renderMessages(forceScroll || changed);
      }
    } catch (e) {
      elSyncStat.textContent = `拉取失败 (${e.message}) · 请检查数据源`;
      elLiveDot.classList.add('off');
    }
  }

  document.getElementById('tab-chats').addEventListener('click', () => {
    activeTab = 'chats';
    document.getElementById('tab-chats').classList.add('active');
    document.getElementById('tab-roster').classList.remove('active');
    renderSidebar();
  });
  document.getElementById('tab-roster').addEventListener('click', () => {
    activeTab = 'roster';
    document.getElementById('tab-roster').classList.add('active');
    document.getElementById('tab-chats').classList.remove('active');
    renderSidebar();
  });
  elSearch.addEventListener('input', () => {
    searchQuery = elSearch.value.trim().toLowerCase();
    renderMessages(true);
  });
  document.querySelectorAll('.f-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.f-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeRoleFilter = btn.getAttribute('data-role');
      renderMessages(true);
    });
  });
  document.getElementById('btn-live-poll').addEventListener('click', e => {
    livePolling = !livePolling;
    e.target.classList.toggle('on', livePolling);
    e.target.textContent = livePolling ? '实时刷新: 4s' : '实时刷新: 暂停';
    elLiveDot.classList.toggle('off', !livePolling);
  });
  document.getElementById('btn-refresh-now').addEventListener('click', () => fetchMessages(true));

  const openCfg = () => { elCfgIn.value = apiUrl; elModal.classList.add('on'); };
  document.getElementById('btn-open-cfg').addEventListener('click', openCfg);
  document.getElementById('btn-cfg-top').addEventListener('click', openCfg);
  document.getElementById('cfg-cancel').addEventListener('click', () => elModal.classList.remove('on'));
  document.getElementById('cfg-save').addEventListener('click', () => {
    apiUrl = elCfgIn.value.trim();
    if (apiUrl) localStorage.setItem(STORAGE_KEY_API, apiUrl);
    else localStorage.removeItem(STORAGE_KEY_API);
    elModal.classList.remove('on');
    fetchMessages(true);
  });

  renderSidebar();
  fetchMessages(true);
  setInterval(() => { if (livePolling) fetchMessages(false); }, 4000);
})();
</script>
</body>
</html>
