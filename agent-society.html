<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>X-PHS 32-Agent 城市社会实时群聊</title>
<style>
  :root {
    --rail-bg: #2e2e2e;
    --list-bg: #e7e6e5;
    --list-hover: #dcdad8;
    --list-active: #c8c6c5;
    --chat-bg: #f5f5f5;
    --border: #dcdcdc;
    --bubble-self: #95ec69;
    --bubble-other: #ffffff;
    --text-main: #181818;
    --text-sub: #7f7f7f;
    --wx-green: #07c160;
    --wx-red: #fa5151;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Inter", sans-serif;
    background: #d8d8d8;
    color: var(--text-main);
    overflow: hidden;
  }
  .wx-shell {
    display: flex;
    height: 100vh;
    width: 100vw;
    max-width: 1380px;
    margin: 0 auto;
    background: var(--chat-bg);
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  }
  /* 左侧微信深色图标栏 */
  .wx-rail {
    width: 58px;
    background: var(--rail-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 0 14px;
    gap: 18px;
    flex-shrink: 0;
  }
  .rail-avatar {
    width: 36px; height: 36px; border-radius: 5px;
    background: linear-gradient(135deg, #07c160, #059669);
    color: #fff; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .rail-btn {
    width: 36px; height: 36px; border-radius: 6px;
    border: none; background: transparent; color: #9c9c9c;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .rail-btn:hover, .rail-btn.active { color: var(--wx-green); background: rgba(255,255,255,0.08); }
  .rail-spacer { flex: 1; }

  /* 中间群聊列表栏 */
  .wx-list {
    width: 270px;
    background: var(--list-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .list-search {
    padding: 12px 10px 10px;
    background: #f7f7f7;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .list-search input {
    flex: 1; height: 28px; padding: 0 9px;
    border: none; border-radius: 4px;
    background: #e2e2e2; font-size: 12.5px; color: #222;
    outline: none;
  }
  .list-search input:focus { background: #fff; box-shadow: 0 0 0 1px #c8c8c8; }
  .list-items { flex: 1; overflow-y: auto; }
  .chat-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; cursor: pointer;
    border-bottom: 1px solid rgba(0,0,0,0.03);
    transition: background .12s;
  }
  .chat-item:hover { background: var(--list-hover); }
  .chat-item.active { background: var(--list-active); }
  .item-ava {
    width: 40px; height: 40px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; color: #fff; flex-shrink: 0;
    position: relative;
  }
  .item-badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--wx-red); color: #fff;
    font-size: 10px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .item-name { font-size: 13.5px; font-weight: 500; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-time { font-size: 10.5px; color: #999; flex-shrink: 0; margin-left: 6px; }
  .item-preview { font-size: 11.5px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-tag {
    display: inline-block; font-size: 9.5px; padding: 0 4px; border-radius: 3px;
    margin-right: 4px; vertical-align: 1px;
  }
  .tag-pub { background: #dbeafe; color: #1d4ed8; }
  .tag-priv { background: #fee2e2; color: #b91c1c; }

  /* 右侧聊天主区 */
  .wx-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--chat-bg);
  }
  .chat-header {
    height: 54px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .hdr-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hdr-back {
    display: none; border: none; background: transparent;
    font-size: 18px; cursor: pointer; color: #333; padding: 4px 6px;
  }
  .hdr-title { font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-sub { font-size: 11px; color: var(--text-sub); }
  .hdr-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .sync-pill {
    font-size: 11px; color: #555; background: #eaeaea;
    padding: 3px 9px; border-radius: 999px;
    display: flex; align-items: center; gap: 5px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
  .dot.live { background: var(--wx-green); box-shadow: 0 0 6px rgba(7,193,96,0.7); }
  .dot.stop { background: var(--wx-red); }
  .ctrl-btn {
    border: none; border-radius: 5px; padding: 5px 11px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: opacity .15s;
  }
  .ctrl-btn:hover { opacity: 0.88; }
  .ctrl-btn.running { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
  .ctrl-btn.stopped { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }

  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .sys-notice {
    align-self: center;
    background: rgba(0,0,0,0.06);
    color: #666;
    font-size: 11.5px;
    padding: 4px 12px;
    border-radius: 4px;
    text-align: center;
    max-width: 90%;
  }
  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: 82%;
  }
  .msg-row.right { align-self: flex-end; flex-direction: row-reverse; }
  .msg-ava {
    width: 38px; height: 38px; border-radius: 4px;
    color: #fff; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .msg-content { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .msg-row.right .msg-content { align-items: flex-end; }
  .msg-meta {
    font-size: 11px; color: #888;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .role-chip {
    font-size: 10px; color: #fff; padding: 0 5px; border-radius: 3px; line-height: 16px;
  }
  .chan-chip {
    font-size: 10px; padding: 0 5px; border-radius: 3px; line-height: 16px;
    background: #ececec; color: #555;
  }
  .bubble {
    padding: 9px 13px;
    border-radius: 5px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
    position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,0.05);
  }
  .msg-row.left .bubble { background: var(--bubble-other); color: #181818; }
  .msg-row.right .bubble { background: var(--bubble-self); color: #111; }
  .bubble-foot {
    margin-top: 4px; font-size: 10.5px; color: rgba(0,0,0,0.45);
    display: flex; gap: 8px; flex-wrap: wrap;
  }

  .chat-footer {
    border-top: 1px solid var(--border);
    background: #f5f5f5;
    padding: 9px 16px;
    font-size: 12px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  .ft-links { display: flex; gap: 12px; align-items: center; }
  .ft-btn {
    border: 1px solid #d4d4d4; background: #fff; color: #333;
    padding: 3px 10px; border-radius: 4px; font-size: 11.5px; cursor: pointer;
  }
  .ft-btn:hover { background: #eee; }

  /* 配置弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center; z-index: 99;
    padding: 16px;
  }
  .modal-mask.open { display: flex; }
  .modal-box {
    width: 460px; max-width: 100%; background: #fff; border-radius: 8px;
    padding: 18px 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.22);
  }
  .modal-box h3 { font-size: 15px; margin-bottom: 8px; }
  .modal-box p { font-size: 12px; color: #666; line-height: 1.55; margin-bottom: 10px; }
  .modal-box input {
    width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 5px;
    font-size: 12.5px; margin-bottom: 10px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn-primary {
    background: var(--wx-green); color: #fff; border: none;
    padding: 6px 14px; border-radius: 5px; font-size: 12.5px; cursor: pointer;
  }
  .btn-cancel {
    background: #f3f4f6; color: #374151; border: 1px solid #d1d5db;
    padding: 6px 14px; border-radius: 5px; font-size: 12.5px; cursor: pointer;
  }

  /* 手机端自适应（躺床上手机浏览与远程启停） */
  @media (max-width: 768px) {
    .wx-rail { display: none; }
    .wx-list { width: 100%; border-right: none; }
    .wx-main { width: 100%; }
    .wx-shell.mobile-chat .wx-list { display: none; }
    .wx-shell:not(.mobile-chat) .wx-main { display: none; }
    .hdr-back { display: inline-flex; }
    .chat-header { padding: 0 10px; height: 50px; }
    .hdr-title { font-size: 14.5px; }
    .sync-pill { display: none; }
    .msg-row { max-width: 92%; }
    .chat-body { padding: 12px 12px 18px; }
  }
</style>
</head>
<body>
<div class="wx-shell mobile-chat" id="wx-shell">
  <!-- 左侧窄边栏 -->
  <aside class="wx-rail">
    <div class="rail-avatar" title="X-PHS 32 Agent 社会">32A</div>
    <button class="rail-btn active" title="群聊频道" onclick="selectChannel('工作总群')">💬</button>
    <button class="rail-btn" title="全部实时消息流" onclick="selectChannel('ALL')">🌐</button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" title="数据源与口令配置" onclick="openConfig()">⚙</button>
  </aside>

  <!-- 中间群聊列表 -->
  <aside class="wx-list">
    <div class="list-search">
      <input id="search-input" type="text" placeholder="搜索发言人 / 关键词…" oninput="renderChat()">
    </div>
    <div class="list-items" id="channel-list"></div>
  </aside>

  <!-- 右侧聊天主窗 -->
  <main class="wx-main">
    <header class="chat-header">
      <div class="hdr-left">
        <button class="hdr-back" id="btn-back" onclick="toggleMobileList(true)" title="返回群列表">‹</button>
        <div>
          <div class="hdr-title" id="hdr-title">城市建设工作总群 (32)</div>
          <div class="hdr-sub" id="hdr-sub">公开体面 · 按流程协作沟通</div>
        </div>
      </div>
      <div class="hdr-right">
        <div class="sync-pill" id="sync-pill"><span class="dot" id="sync-dot"></span><span id="sync-text">连接中…</span></div>
        <button class="ctrl-btn running" id="btn-remote-ctrl" onclick="toggleRemoteAgent()">⏹ 停止 Agent</button>
      </div>
    </header>

    <section class="chat-body" id="chat-body"></section>

    <footer class="chat-footer">
      <span id="footer-status">每 4 秒自动同步 Google Sheets 实时对话</span>
      <div class="ft-links">
        <button class="ft-btn" onclick="openConfig()">配置</button>
        <button class="ft-btn" onclick="fetchLatest(true)">刷新</button>
      </div>
    </footer>
  </main>
</div>

<!-- 数据源与口令弹窗 -->
<div class="modal-mask" id="cfg-modal">
  <div class="modal-box">
    <h3>数据源与远程遥控配置</h3>
    <p>默认已接入你的 Google Sheets Apps Script 实时中继。如需在手机端远程启停电脑上的 32 个 Agent，请输入你的专属远程控制口令。</p>
    <input id="cfg-url" type="text" placeholder="Google Apps Script Web App URL">
    <input id="cfg-pin" type="password" placeholder="远程控制口令">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeConfig()">取消</button>
      <button class="btn-primary" onclick="saveConfig()">保存</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_SHEET_API = 'https://script.google.com/macros/s/AKfycbysI1bbX7Imf3vdV1dZPZcsW1oDMkl3xUP00J-eSmMuTMRSVcQq4ENOZUnTwWPNvSlbYQ/exec';
const FALLBACK_JSON = './data/agent-dialogues.json';
const LS_API = 'xphs_wx_sheet_api_v2';
const LS_PIN = 'xphs_wx_ctrl_pin_v1';

const CHANNELS = [
  { id: 'ALL',      name: '全部频道总览',     sub: '汇总大群、各小群与私聊的全部实时动态', icon: '🌐', bg: '#334155', priv: false },
  { id: '工作总群', name: '城市建设工作总群(32)', sub: '公开大群 · 客气稳重、讲究分寸与体面', icon: '📢', bg: '#07c160', priv: false },
  { id: '核心小群', name: '指挥部核心小群(4)',  sub: '领导与骨干私下权衡政绩、资源与分工', icon: '🔒', bg: '#b45309', priv: true },
  { id: '经理小群', name: '片区经理通气群(6)',  sub: '中层私下通气、吐槽与互相试探',       icon: '💬', bg: '#0369a1', priv: true },
  { id: '一线小群', name: '一线工地茶水间(16)', sub: '施工班组私下抱怨加班、赶工与实话',   icon: '🍺', bg: '#c2410c', priv: true },
  { id: '监理小群', name: '质检风控内部群(8)',  sub: '监理私下商量红线、担责与留痕',       icon: '🔍', bg: '#047857', priv: true },
  { id: '私聊',     name: '私聊悄悄话',       sub: '两人私下递话、拉关系或暗中议论',     icon: '👤', bg: '#6d28d9', priv: true }
];

const ROLE_COLORS = {
  '城市领导': '#b45309',
  '片区经理': '#0369a1',
  '施工工程师': '#c2410c',
  '质检监理': '#047857',
  '注册市民': '#4338ca'
};

let currentChannel = 'ALL';
let allEntries = [];
let remoteRunning = true;
let lastRenderedKey = '';

function getApiUrl() {
  const saved = localStorage.getItem(LS_API);
  return (saved && saved.trim()) ? saved.trim() : DEFAULT_SHEET_API;
}

function getPin() {
  return localStorage.getItem(LS_PIN) || '';
}

function toggleMobileList(showList) {
  const sh = document.getElementById('wx-shell');
  if (showList) sh.classList.remove('mobile-chat');
  else sh.classList.add('mobile-chat');
}

function selectChannel(chId) {
  currentChannel = chId;
  lastRenderedKey = '';
  const ch = CHANNELS.find(c => c.id === chId) || CHANNELS[0];
  document.getElementById('hdr-title').textContent = ch.name;
  document.getElementById('hdr-sub').textContent = ch.sub;
  toggleMobileList(false);
  renderChannelList();
  renderChat(true);
}

function renderChannelList() {
  const container = document.getElementById('channel-list');
  container.innerHTML = CHANNELS.map(ch => {
    const msgs = ch.id === 'ALL'
      ? allEntries
      : allEntries.filter(e => (e.channel || '工作总群') === ch.id);
    const last = msgs.length ? msgs[msgs.length - 1] : null;
    const preview = last ? `${last.speaker.split('(')[0]}: ${last.text}` : '暂无消息';
    const tm = last ? last.time : '';
    const active = ch.id === currentChannel ? 'active' : '';
    const tag = ch.id === 'ALL' ? '' : (ch.priv ? '<span class="item-tag tag-priv">私密</span>' : '<span class="item-tag tag-pub">公开</span>');
    return `
      <div class="chat-item ${active}" onclick="selectChannel('${ch.id}')">
        <div class="item-ava" style="background:${ch.bg}">
          ${ch.icon}
          ${msgs.length ? `<span class="item-badge">${msgs.length > 99 ? '99+' : msgs.length}</span>` : ''}
        </div>
        <div class="item-info">
          <div class="item-top">
            <span class="item-name">${ch.name}</span>
            <span class="item-time">${tm}</span>
          </div>
          <div class="item-preview">${tag}${escapeHtml(preview)}</div>
        </div>
      </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderChat(forceScroll = false) {
  const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
  let list = currentChannel === 'ALL'
    ? allEntries
    : allEntries.filter(e => (e.channel || '工作总群') === currentChannel);
  if (q) {
    list = list.filter(e =>
      (e.speaker || '').toLowerCase().includes(q) ||
      (e.text || '').toLowerCase().includes(q) ||
      (e.role || '').toLowerCase().includes(q) ||
      (e.channel || '').toLowerCase().includes(q)
    );
  }
  const key = currentChannel + '|' + q + '|' + list.length + '|' + (list.length ? list[list.length - 1].text : '');
  if (!forceScroll && key === lastRenderedKey) return;
  lastRenderedKey = key;

  const body = document.getElementById('chat-body');
  const nearBottom = (body.scrollHeight - body.scrollTop - body.clientHeight) < 120;
  const ch = CHANNELS.find(c => c.id === currentChannel) || CHANNELS[0];

  const intro = ch.priv
    ? `<div class="sys-notice">🔒 你正在旁观「${ch.name}」— 仅内部成员可见的私下聊天记录</div>`
    : `<div class="sys-notice">📢 ${ch.name} · ${ch.sub}</div>`;

  if (!list.length) {
    body.innerHTML = intro + `<div class="sys-notice">该频道暂无对话记录，开启电脑端 Agent 后将自动实时同步</div>`;
    return;
  }

  body.innerHTML = intro + list.map(m => {
    const isLeader = m.role === '城市领导';
    const side = isLeader ? 'right' : 'left';
    const col = ROLE_COLORS[m.role] || '#475569';
    const shortName = (m.speaker || 'A').replace(/\(.*\)/, '').slice(-2);
    const chanName = m.channel || '工作总群';
    const targetTxt = m.target ? `@${m.target.replace(/\(.*\)/, '')}` : '';
    return `
      <div class="msg-row ${side}">
        <div class="msg-ava" style="background:${col}">${escapeHtml(shortName)}</div>
        <div class="msg-content">
          <div class="msg-meta">
            <span>${escapeHtml(m.speaker)}</span>
            <span class="role-chip" style="background:${col}">${escapeHtml(m.role || '成员')}</span>
            ${currentChannel === 'ALL' ? `<span class="chan-chip">${escapeHtml(chanName)}</span>` : ''}
            <span>${escapeHtml(m.time || '')}</span>
          </div>
          <div class="bubble">
            ${targetTxt ? `<span style="color:#0369a1;margin-right:4px;">${escapeHtml(targetTxt)}</span>` : ''}${escapeHtml(m.text)}
            ${m.location ? `<div class="bubble-foot"><span>📍 ${escapeHtml(m.location)}</span></div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  if (forceScroll || nearBottom) {
    body.scrollTop = body.scrollHeight;
  }
}

function updateControlBtn() {
  const btn = document.getElementById('btn-remote-ctrl');
  const dot = document.getElementById('sync-dot');
  if (remoteRunning) {
    btn.className = 'ctrl-btn running';
    btn.textContent = '⏹ 停止 Agent';
    dot.className = 'dot live';
  } else {
    btn.className = 'ctrl-btn stopped';
    btn.textContent = '▶ 启动 Agent';
    dot.className = 'dot stop';
  }
}

async function toggleRemoteAgent() {
  let pin = getPin();
  if (!pin) {
    pin = window.prompt('请输入远程控制口令：', '');
    if (pin === null) return;
    pin = pin.trim();
    if (!pin) return;
    localStorage.setItem(LS_PIN, pin);
  }
  const nextRunning = !remoteRunning;
  const api = getApiUrl();
  const btn = document.getElementById('btn-remote-ctrl');
  btn.disabled = true;
  btn.textContent = '同步中…';
  try {
    const url = `${api}?action=set_control&running=${nextRunning ? 'true' : 'false'}&pin=${encodeURIComponent(pin)}&_t=${Date.now()}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) {
      if ((data.error || '').includes('口令')) localStorage.removeItem(LS_PIN);
      alert('远程切换失败：' + (data.error || '未知错误'));
    } else {
      remoteRunning = !!(data.control && data.control.running);
      document.getElementById('footer-status').textContent =
        remoteRunning ? '已远程下发【启动】，电脑端将在 8 秒内恢复运行' : '已远程下发【停止】，电脑端将在 8 秒内暂停所有 Agent 与 API 调用';
    }
  } catch (e) {
    alert('网络请求失败：' + e.message);
  } finally {
    btn.disabled = false;
    updateControlBtn();
  }
}

async function fetchLatest(manual = false) {
  const api = getApiUrl();
  const syncText = document.getElementById('sync-text');
  try {
    const res = await fetch(`${api}?_t=${Date.now()}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.ok) {
      if (data.control && typeof data.control.running === 'boolean') {
        remoteRunning = data.control.running;
        updateControlBtn();
      }
      if (Array.isArray(data.entries) && data.entries.length > 0) {
        allEntries = data.entries;
        syncText.textContent = `实时在线 · ${allEntries.length}条`;
      } else {
        // 云端表格尚未写入任何新消息时，先展示静态兜底样本
        if (!allEntries.length) await loadFallback();
        syncText.textContent = `云端已连通 · 等待新消息`;
      }
      renderChannelList();
      renderChat(manual);
      return;
    }
  } catch (_) {}
  await loadFallback();
  syncText.textContent = '离线兜底模式';
  renderChannelList();
  renderChat(manual);
}

async function loadFallback() {
  try {
    const r = await fetch(`${FALLBACK_JSON}?_t=${Date.now()}`);
    const d = await r.json();
    if (Array.isArray(d.entries)) allEntries = d.entries;
  } catch (_) {}
}

function openConfig() {
  document.getElementById('cfg-url').value = getApiUrl();
  document.getElementById('cfg-pin').value = getPin();
  document.getElementById('cfg-modal').classList.add('open');
}
function closeConfig() {
  document.getElementById('cfg-modal').classList.remove('open');
}
function saveConfig() {
  const u = document.getElementById('cfg-url').value.trim();
  const p = document.getElementById('cfg-pin').value.trim();
  if (u) localStorage.setItem(LS_API, u);
  if (p) localStorage.setItem(LS_PIN, p);
  closeConfig();
  fetchLatest(true);
}

selectChannel('ALL');
updateControlBtn();
fetchLatest(true);
setInterval(() => fetchLatest(false), 4000);
</script>
